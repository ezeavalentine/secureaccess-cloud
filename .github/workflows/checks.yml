name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: secureaccess_test
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: secureaccess_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U secureaccess_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://secureaccess_test:local-test-password@localhost:5432/secureaccess_test
      - run: python -m pip_audit -r backend/requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build && npm test && npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/infrastructure/terraform:/work" -w /work hashicorp/terraform:1.13.5 fmt -check
      - run: docker run --rm -v "$PWD/infrastructure/terraform:/work" -w /work hashicorp/terraform:1.13.5 init -backend=false -input=false
      - run: docker run --rm -v "$PWD/infrastructure/terraform:/work" -w /work hashicorp/terraform:1.13.5 validate
