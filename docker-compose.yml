services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:////app/data/secureaccess.db
      AWS_REGION: us-east-1
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  backend_data:
